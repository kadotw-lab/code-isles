<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="六週 Python 演算法課程的 3D 互動群島：每座六角形小島是一週課程，內含生活暖身、互動實驗室、Colab 填空、除錯、自我檢核與延伸挑戰。">
<meta property="og:title" content="程式設計群島 Code Isles">
<meta property="og:description" content="Python 演算法微專案：智慧超商營運管理系統｜六週互動課程地圖">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>程式設計群島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D toy city; brand card top-left, control dock top-right,
   detail sheet as a left rail on wide screens and a bottom sheet on phones. */
:root{
  --paper:#FFF9F1; --paper-2:#F5E9DA; --paper-3:#EEDDC8;
  --ink:#2B221D; --muted:#7A685B; --line:rgba(43,34,29,.13);
  --accent:#E2622B; --accent-ink:#FFFFFF; --accent-soft:#FBE3D6;
  --teal:#0F766E; --teal-soft:#DCEFEA;
  --good:#2F8F5B; --good-soft:#E0F2E6; --bad:#C2412D; --bad-soft:#FBE3DE;
  --gold:#E9B44C; --gold-soft:#FCEFD0;
  --code-bg:#2A2420; --code-fg:#F6EADB; --code-dim:#A8978A; --blank:#FFCF70;
  --scrim:rgba(43,30,20,.30);
  --shadow:0 14px 34px rgba(70,40,20,.18), 0 2px 6px rgba(70,40,20,.10);
  --font-display:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#2A231F; --paper-2:#352C26; --paper-3:#433830;
    --ink:#F7ECDF; --muted:#BFAC9C; --line:rgba(247,236,223,.14);
    --accent:#F0773F; --accent-ink:#1F1813; --accent-soft:#4A2C1E;
    --teal:#4CC2B4; --teal-soft:#1E3A36;
    --good:#6CCB92; --good-soft:#1F3A2A; --bad:#F08A73; --bad-soft:#47241D;
    --gold:#F2C56A; --gold-soft:#47391C;
    --code-bg:#1B1714; --code-fg:#F6EADB; --code-dim:#9A8A7E; --blank:#F2C56A;
    --scrim:rgba(0,0,0,.45);
    --shadow:0 14px 34px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#2A231F; --paper-2:#352C26; --paper-3:#433830;
  --ink:#F7ECDF; --muted:#BFAC9C; --line:rgba(247,236,223,.14);
  --accent:#F0773F; --accent-ink:#1F1813; --accent-soft:#4A2C1E;
  --teal:#4CC2B4; --teal-soft:#1E3A36;
  --good:#6CCB92; --good-soft:#1F3A2A; --bad:#F08A73; --bad-soft:#47241D;
  --gold:#F2C56A; --gold-soft:#47391C;
  --code-bg:#1B1714; --code-fg:#F6EADB; --code-dim:#9A8A7E; --blank:#F2C56A;
  --scrim:rgba(0,0,0,.45);
  --shadow:0 14px 34px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0;background:#BFE2E6}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#overlay{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}

/* island labels & pins */
.isle-label{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:6px 13px 6px 9px;border-radius:999px;border:0;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);font:700 14px/1.1 var(--font-body);white-space:nowrap;cursor:pointer;pointer-events:auto;will-change:transform;transition:background .2s,color .2s,opacity .2s}
.isle-label .no{font:700 11px/1 var(--font-mono);color:var(--accent);letter-spacing:.04em}
.isle-label .sw{width:10px;height:10px;border-radius:3px;background:var(--c);transform:rotate(30deg);flex:none}
.isle-label .ck{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--good);color:var(--paper);font-size:11px}
.isle-label.on{background:var(--ink);color:var(--paper)}
.isle-label.on .no{color:var(--gold)}
.isle-label.dim{opacity:.55}
.isle-label:hover{transform-origin:center}
.pin{position:absolute;left:0;top:0;width:32px;height:32px;margin:0;border-radius:50%;border:2.5px solid var(--accent);background:var(--paper);color:var(--accent);font:700 15px/1 var(--font-mono);display:grid;place-items:center;cursor:pointer;pointer-events:auto;box-shadow:var(--shadow);will-change:transform;padding:0}
.pin::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:18px;background:var(--accent);transform:translateX(-50%);opacity:.8}
.pin .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--ink);color:var(--paper);font:600 12px/1.2 var(--font-body);padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.pin:hover .tip,.pin:focus-visible .tip,.pin.on .tip{opacity:1}
.pin.on{background:var(--accent);color:var(--accent-ink)}

/* brand */
.brand{position:fixed;z-index:12;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;padding:10px 18px 10px 12px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);max-width:calc(100% - 132px)}
.brand svg{flex:none}
.brand-name{font:400 23px/1.05 var(--font-display);letter-spacing:.04em;color:var(--ink)}
.brand-sub{font:700 10.5px/1.3 var(--font-mono);letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-top:4px}
.brand-sub span{color:var(--muted);letter-spacing:.04em;font-family:var(--font-body);text-transform:none;font-weight:500}

/* dock */
.dock{position:fixed;z-index:12;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.dock button{width:66px;padding:10px 0 8px;border-radius:16px;border:0;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12.5px/1 var(--font-body);cursor:pointer}
.dock button svg{width:20px;height:20px}
.dock button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dock button:hover{background:var(--paper-2)}
.dock button[aria-pressed="true"]:hover{background:var(--ink)}
.timebar{position:fixed;z-index:13;display:flex;gap:4px;padding:6px;border-radius:18px;background:var(--paper);box-shadow:var(--shadow)}
.timebar button{border:0;background:transparent;border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11.5px/1 var(--font-body);cursor:pointer;min-width:48px}
.timebar button svg{width:18px;height:18px}
.timebar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.timebar .sep{width:1px;background:var(--line);margin:4px 2px}

/* sheet */
.sheet{position:fixed;z-index:20;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 2px 22px;flex:none}
.sheet-crumb{font:700 11px/1.2 var(--font-mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.sheet-crumb button{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;letter-spacing:inherit;text-transform:inherit}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--paper-2);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--paper-3)}
.sheet-scroll{overflow:auto;padding:6px 22px 26px;overscroll-behavior:contain;flex:1;min-height:0}
.grab{display:none}
@media (max-width:899px){
  .sheet{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:0;max-height:52%;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
  .brand{padding:8px 14px 8px 10px;gap:10px}
  .brand-name{font-size:19px}
  .brand-sub span{display:none}
}
@media (min-width:900px){
  .sheet{left:max(16px,env(safe-area-inset-left,0px));top:calc(100px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(430px,40vw);border-radius:24px}
}

/* sheet content */
.eyebrow{font:700 11px/1.3 var(--font-mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin:0}
.head{display:flex;gap:14px;align-items:flex-start;margin:6px 0 12px}
.badge{flex:none;width:58px;height:58px;display:grid;place-items:center;font:700 19px/1 var(--font-mono);color:#2B221D;background:var(--c);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
h2{font:400 27px/1.2 var(--font-display);letter-spacing:.02em;margin:4px 0 2px;text-wrap:balance}
h3{font:700 14px/1.3 var(--font-body);margin:22px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.04em}
h3::before{content:"";width:9px;height:9px;background:var(--accent);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.lead{margin:0 0 10px}
.motto{margin:12px 0;padding:12px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--paper-2);font:600 12px/1.4 var(--font-body);color:var(--ink)}
.chip.mono{font-family:var(--font-mono);font-size:11.5px}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent))}
ol.goals{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:g}
ol.goals li{counter-increment:g;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
ol.goals li::before{content:"G" counter(g);font:700 12px/1.9 var(--font-mono);color:var(--teal)}
.stops{display:grid;gap:8px}
.stop{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;transition:background .15s}
.stop:hover{background:var(--paper-2)}
.stop .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:700 13px/1 var(--font-mono)}
.stop b{display:block;font-size:14px}
.stop small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.stop .go{color:var(--muted);font-size:18px}
.fn{font-family:var(--font-mono);font-size:12.5px;background:var(--teal-soft);color:var(--teal);padding:2px 7px;border-radius:6px}
code{font-family:var(--font-mono);font-size:.88em;background:var(--paper-2);padding:1px 5px;border-radius:5px}
.checks{display:grid;gap:6px}
.check{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--paper-2);cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--good);flex:none}
.files{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.files li{display:flex;gap:8px}
.files li::before{content:"▪";color:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font:600 13.5px/1.2 var(--font-body);cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:default}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:8px}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 11.5px/1 var(--font-mono);margin-top:3px}
.think{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);font-size:14px}
.think b{color:var(--ink)}
ul.points{margin:0;padding-left:1.1em;display:grid;gap:6px}
.codebox{background:var(--code-bg);color:var(--code-fg);border-radius:14px;padding:14px 16px;overflow-x:auto;font:500 12.5px/1.75 var(--font-mono);white-space:pre;tab-size:4}
.codebox .cm{color:var(--code-dim)}
.blank{font:700 12px/1.3 var(--font-mono);border:0;border-radius:5px;padding:1px 8px;margin:0 1px;background:var(--blank);color:#2B221D;cursor:pointer;vertical-align:baseline}
.blank.shown{background:#7ED3A6;color:#123322}
.code-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 0;flex-wrap:wrap}
.code-tools small{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl-wrap{overflow-x:auto}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:600}
.quiz{display:grid;gap:16px}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:grid;gap:6px}
.opt{text-align:left;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px}
.opt:hover{background:var(--paper-2)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.why{margin-top:8px;font-size:13.5px;padding:9px 12px;border-radius:10px;background:var(--paper-2)}
.why b.ok{color:var(--good)} .why b.no{color:var(--bad)}
.chal{display:grid;gap:10px}
.chal div{padding:12px 14px;border-radius:14px;background:var(--paper-2)}
.chal .lv{color:var(--gold);letter-spacing:.1em;font-size:13px}
.chal b{display:block;margin:2px 0}
.chal p{margin:0;font-size:13.5px;color:var(--muted)}

/* lab */
.lab{margin:14px 0 4px;padding:14px;border-radius:16px;border:1.5px dashed var(--line);background:var(--paper)}
.lab-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lab-title b{font:700 13px/1.2 var(--font-mono);letter-spacing:.08em;color:var(--teal)}
.seg{display:inline-flex;background:var(--paper-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font:600 12px/1.2 var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lab select,.lab input{font:600 13px var(--font-body);padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.cell{position:relative;border-radius:11px;background:var(--paper-2);padding:7px 4px 6px;text-align:center;font-size:11.5px;line-height:1.3;transition:background .2s,opacity .2s,transform .2s;border:2px solid transparent}
.cell b{display:block;font:700 16px/1.3 var(--font-mono)}
.cell .mk{position:absolute;top:-9px;right:-4px;font:700 10px/1 var(--font-mono);background:var(--ink);color:var(--paper);padding:3px 5px;border-radius:6px}
.cell.cur{border-color:var(--accent);transform:translateY(-2px)}
.cell.champ{background:var(--gold-soft);border-color:var(--gold)}
.cell.out{opacity:.38}
.cell.hit{background:var(--good-soft);border-color:var(--good)}
.cell.done{background:var(--good-soft)}
.cards{display:flex;gap:8px;justify-content:center;margin:12px 0}
.card{width:54px;height:76px;border-radius:9px;background:#FFFDF8;color:#2B221D;border:2px solid #E3D4C2;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 22px/1 var(--font-mono);transition:transform .35s,border-color .2s,background .2s}
.card small{font-size:15px;color:#C2412D}
.card.min{border-color:var(--accent);transform:translateY(-8px)}
.card.done{background:#E0F2E6;border-color:#2F8F5B}
.lane{display:flex;gap:6px;align-items:flex-end;min-height:64px;margin:10px 0;padding:8px;border-radius:12px;background:var(--paper-2);overflow-x:auto}
.lane .p{flex:none;padding:6px 10px;border-radius:10px;background:var(--paper);font-size:13px;font-weight:600;text-align:center;border:2px solid transparent}
.lane .p small{display:block;font:700 10px/1 var(--font-mono);color:var(--muted);margin-top:3px}
.lane .p.front{border-color:var(--accent)}
.lane .empty{color:var(--muted);font-size:13px;padding:6px}
.stack{display:flex;flex-direction:column-reverse;gap:4px;min-height:60px;padding:8px;border-radius:12px;background:var(--paper-2);margin:10px 0;align-items:stretch}
.stack .p{padding:6px 10px;border-radius:9px;background:var(--paper);font-size:13px;display:flex;justify-content:space-between;border:2px solid transparent}
.stack .p.top{border-color:var(--accent)}
.coins{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:44px;align-items:center}
.coin{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--font-mono);color:#3B2A12;background:#D8DCE0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.coin.c50{background:#E9B44C;width:44px;height:44px}
.coin.c1{background:#C99A5B}
.lab-log{font-size:13px;min-height:40px;padding:9px 12px;border-radius:10px;background:var(--paper-2);margin-top:6px}
.lab-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lab-btns .btn{padding:7px 12px;font-size:13px}
.timeline{display:grid;gap:6px}
.tl{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:14px;border:1px solid var(--line);cursor:pointer;background:transparent;text-align:left}
.tl:hover{background:var(--paper-2)}
.tl .hx{width:34px;height:34px;display:grid;place-items:center;background:var(--c);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font:700 12px/1 var(--font-mono);color:#2B221D}
.tl b{display:block;font-size:14px}
.tl small{color:var(--muted);font-size:12px}
.cycle{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cycle div{padding:10px 12px;border-radius:14px;background:var(--paper-2);font-size:13px;line-height:1.5}
.cycle b{display:block;font-size:14px}
.cycle .f{font:700 10.5px/1 var(--font-mono);color:var(--paper);background:var(--c);padding:3px 6px;border-radius:5px;margin-left:4px;vertical-align:2px}
.prog-head{display:flex;align-items:center;gap:16px;margin:8px 0 6px}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--paper-3) 0);display:grid;place-items:center;flex:none}
.ring span{width:56px;height:56px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:700 16px/1 var(--font-mono)}

/* ---------- camera ---------- */
let fly = null;
const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);

  fly = { t: 0, dur, fT: controls.target.clone(), tT: view.target, fP: camera.position.clone(), tP: view.pos };
}

function fitBox(wU, hU) {

  const sh = open && isNarrow() ? sh0.offsetHeight : 0; const pw = open && !isNarrow() ? sh0.offsetWidth + 16 : 0;
  const aH = Math.max(0.28, (H - sh - 80) / H), aW = Math.max(0.3, (W - pw - 100) / W);

}

  const stop = () => { if (timer) { clearInterval(timer); labTimers = labTimers.filter((x) => x !== timer); timer = null; el.querySelector('[data-a=auto]').textContent = '自動播放'; } };
  el.querySelector('[data-a=step]').addEventListener('click', () => { stop(); step(); render(); });

        if (v === target) { found = mid; done = true; log = `mid = (${lo}+${hi})//2 = ${mid}，價格 ${v} = ${target}，<b>找到 ${SP[mid][0]}！</b>只比對 ${cnt} 次（循序搜尋要 ${mid + 1} 次）。`; }
        else if (v < target) { log = `mid = ${mid}，價格 ${v} &lt; ${target} → 太便宜，<b>low = ${mid + 1}</b>`; lo = mid + 1; }
        else { log = `mid = ${mid}，價格 ${v} &gt; ${target} → 太貴，<b>high = ${mid - 1}</b>`; hi = mid - 1; }
        if (!done && lo > hi) { done = true; log += `<br>low &gt; high，範圍消失，<b>回傳 -1</b>（比對 ${cnt} 次；循序搜尋要 8 次）。`; }
      },
      draw() {
        const cells = SP.map((p, k) => { const out = k < lo || k > hi; let cls = out ? 'out' : ''; if (k === found) cls = 'hit'; else if (k === mid && !done) cls = 'cur'; const mk = [k === lo && !out ? 'L' : '', k === mid ? 'M' : '', k === hi && !out ? 'H' : ''].filter(Boolean).join(' '); return `<div class="cell ${cls}">${mk ? `<span class="mk">${mk}</span>` : ''}${p[0]}<b>${p[3]}</b>索引 ${k}</div>`; }).join('');
        return { html: `<div class="cells">${cells}</div>`, log };
      },
    });
    el.addEventListener('change', (e) => { if (e.target.id === 'lab-price') { target = +e.target.value; el.querySelector('[data-a=reset]').click(); } });
  },
  w3(el) {
    let arr, r, cmp, minI, log, done;
    labStepper(el, {
      title: '撲克牌選擇排序',
      reset() { arr = [5, 2, 8, 1, 4]; r = 0; cmp = 0; minI = -1; done = false; log = '每按一次「下一步」做一輪：在未排序區找最小，換到最前面。'; },
      isDone: () => done,
      step() {
        if (done) return;
        let m = r; for (let j = r + 1; j < 5; j++) { cmp++; if (arr[j] < arr[m]) m = j; }
        minI = r; const fv = (v) => (v === 1 ? 'A' : v);
        if (m !== r) { log = `第 ${r + 1} 輪：在索引 ${r}～4 找到最小 ${fv(arr[m])}（索引 ${m}），和索引 ${r} 的 ${fv(arr[r])} <b>交換</b>。`; [arr[r], arr[m]] = [arr[m], arr[r]]; }
        else log = `第 ${r + 1} 輪：最小值 ${fv(arr[r])} 已經在索引 ${r}，不用動。`;
        r++; if (r >= 4) { done = true; log += `<br>4 輪完成，總共比較 <b>${cmp}</b> 次（5 × 4 ÷ 2）。最後一張自然就是最大的。`; }
      },
      draw() { return { html: `<div class="cards">${arr.map((v, k) => `<div class="card ${k < r || done ? 'done' : ''} ${k === minI && !done ? 'min' : ''}">${v === 1 ? 'A' : v}<small>${v % 2 ? '♥' : '♠'}</small></div>`).join('')}</div>`, log }; },
    });
  },
  w4(el) {
    const NAMES = ['小明', '小華', '小美', '阿強', '小安', '小翊', '阿哲', '小晴'];
    let q = ['小明', '小華', '小美'], ni = 3, log = '目前有 3 位客人排隊。', ticket = 1;
    const render = () => {
      el.innerHTML = `<div class="lab-title"><b>互動實驗室 · 櫃檯排隊</b><span class="sub">左邊是隊首</span></div>
      <div class="lane">${q.length ? q.map((p, k) => `<div class="p ${k === 0 ? 'front' : ''}">${p}<small>${k === 0 ? '隊首 [0]' : k === q.length - 1 ? '隊尾' : `[${k}]`}</small></div>`).join('') : '<span class="empty">隊伍是空的</span>'}</div>
      <div class="lab-log" aria-live="polite">${log}</div>
      <div class="lab-btns"><button class="btn" type="button" data-a="in">客人來排隊 append()</button><button class="btn primary" type="button" data-a="out">叫號結帳 pop(0)</button></div>`;
      el.querySelector('[data-a=in]').addEventListener('click', () => { const nm = NAMES[ni % NAMES.length]; ni++; q.push(nm); log = `<code>queue.append("${nm}")</code> → ${nm} 排到<b>隊尾</b>，目前有 ${q.length} 人。`; render(); });
      el.querySelector('[data-a=out]').addEventListener('click', () => { if (!q.length) { log = '<b>目前沒有客人排隊</b>（防呆生效，沒有執行 pop）。'; render(); return; } const c = q.shift(); log = `<code>queue.pop(0)</code> → 請 <b>${c}</b> 到櫃檯結帳（號碼 A${String(ticket++).padStart(3, '0')}）。`; render(); });
    };
    render();
  },
  w5(el) {
    const ITEMS = [['鮮奶', 45], ['茶葉蛋', 13], ['咖啡', 65], ['泡麵', 28], ['巧克力', 55], ['礦泉水', 20]];
    let cart = [ITEMS[0], ITEMS[1]], k = 2, log = '購物籃裡已經有鮮奶和茶葉蛋。';
    const total = () => cart.reduce((s, x) => s + x[1], 0);
    const render = () => {
      el.innerHTML = `<div class="lab-title"><b>互動實驗室 · 購物籃復原</b><span class="sub">總金額 <b>${total()}</b> 元</span></div>
      <div class="stack">${cart.length ? cart.map((x, i) => `<div class="p ${i === cart.length - 1 ? 'top' : ''}"><span>${x[0]}${i === cart.length - 1 ? '（頂端）' : ''}</span><span>${x[1]} 元</span></div>`).join('') : '<span class="sub" style="padding:6px">購物籃是空的</span>'}</div>
      <div class="lab-log" aria-live="polite">${log}</div>
      <div class="lab-btns"><button class="btn" type="button" data-a="push">放入商品 append()</button><button class="btn primary" type="button" data-a="pop">復原最後一件 pop()</button></div>`;
      el.querySelector('[data-a=push]').addEventListener('click', () => { const it = ITEMS[k % ITEMS.length]; k++; cart.push(it); log = `<code>cart.append(${it[0]})</code> → 疊到最上面。`; render(); });
      el.querySelector('[data-a=pop]').addEventListener('click', () => { if (!cart.length) { log = '<b>購物籃是空的，無法復原</b>（防呆生效）。'; render(); return; } const it = cart.pop(); log = `<code>cart.pop()</code> → 已取消最後放入的 <b>${it[0]}</b>。`; render(); });
    };
    render();
  },
  w6(el) {
    let amount = 87, set = 'tw';
    const SETS = { tw: [50, 10, 5, 1], odd: [4, 3, 1] };
    const greedy = (a, cs) => { const r = []; for (const c of cs) { const n = Math.floor(a / c); a %= c; if (n) r.push([c, n]); } return r; };
    const best = (a, cs) => { const dp = Array(a + 1).fill(Infinity); dp[0] = 0; for (let v = 1; v <= a; v++) for (const c of cs) if (c <= v && dp[v - c] + 1 < dp[v]) dp[v] = dp[v - c] + 1; return dp[a]; };
    const render = () => {
      const cs = SETS[set]; const a = Math.max(0, Math.min(999, amount | 0)); const g = greedy(a, cs); const gn = g.reduce((s, x) => s + x[1], 0); const bn = best(a, cs);
      let rem = a; const rows = cs.map((c) => { const n = Math.floor(rem / c); const left = rem % c; const line = `<tr><td>${c} 元</td><td>${rem} // ${c} = <b>${n}</b></td><td>${rem} % ${c} = ${left}</td></tr>`; rem = left; return line; }).join('');
      el.innerHTML = `<div class="lab-title"><b>互動實驗室 · 找零計算機</b><span class="seg" role="group" aria-label="硬幣組合"><button type="button" data-s="tw" aria-pressed="${set === 'tw'}">台灣硬幣</button><button type="button" data-s="odd" aria-pressed="${set === 'odd'}">反例 4・3・1</button></span></div>
      <label class="sub" style="display:flex;gap:8px;align-items:center">要找的金額 <input id="lab-amt" type="number" min="0" max="999" value="${a}" style="width:90px"> 元</label>
      <div class="coins">${g.length ? g.map(([c, n]) => Array.from({ length: n }, () => `<span class="coin c${c}">${c}</span>`).join('')).join('') : '<span class="sub">不用找零</span>'}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>面額</th><th>給幾個（//）</th><th>還剩（%）</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="lab-log" aria-live="polite">貪婪法共 <b>${gn}</b> 枚；最少可能是 <b>${bn}</b> 枚。${gn === bn ? '這次貪婪剛好是最佳解。' : '<b>貪婪不是最佳解！</b>先拿最大面額反而多用了硬幣。'}</div>`;
      el.querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => { set = b.dataset.s; if (set === 'odd') amount = 6; else amount = 87; render(); }));
      el.querySelector('#lab-amt').addEventListener('change', (e) => { amount = +e.target.value; render(); });
    };
    render();
  },
};

/* ============================== 導覽、時間、控制 ============================== */
const COACH = [
  ['Code Isles / 01', '每座島是一週課程', '六座六角形小島繞著中央的超商總部排成一圈，從第 1 週的庫存盤點島，一路走到第 6 週的收銀找零島。點一座島，或用右側清單探索。'],
  ['Code Isles / 02', '渡輪與纜車在運送你的函式', '渡輪沿著六週航線，在相鄰小島的碼頭之間往返；纜車把每週完成的函式送回中央總部。第 6 週，這些函式會被組裝成一套完整的超商營運系統。'],
  ['Code Isles / 03', '點編號，走進每一站', '進入小島後，①～⑥ 號站點依學習順序排好：生活暖身、核心概念、Colab 填空、除錯小幫手、自我檢核、延伸挑戰。'],
];
let coachI = 0;
function showCoach(i) {
  coachI = i; const [e, t, b] = COACH[i];
  $('#coach-eyebrow').textContent = e; $('#coach-title').textContent = t; $('#coach-body').textContent = b;
  $('#coach-dots').innerHTML = COACH.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
  $('#coach-next').textContent = i === COACH.length - 1 ? '走進群島 →' : '下一步 →';
  $('#coach').hidden = false; $('#coach-next').focus();
}
function closeCoach() { $('#coach').hidden = true; store.set('codeIsles.coach', 1); $('#btn-help').setAttribute('aria-pressed', 'false'); }
$('#coach-next').addEventListener('click', () => (coachI < COACH.length - 1 ? showCoach(coachI + 1) : closeCoach()));
$('#coach-skip').addEventListener('click', closeCoach);

const timebar = $('#timebar');
function placeTimebar() { const b = $('#btn-time').getBoundingClientRect(); timebar.style.top = `${b.top}px`; timebar.style.right = `${innerWidth - b.left + 10}px`; }
function syncTimeButtons() { timebar.querySelectorAll('[data-time]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.time === timeKey))); $('#btn-pause span').textContent = paused ? '播放' : '暫停'; $('#btn-pause').setAttribute('aria-pressed', String(paused)); }
$('#btn-time').addEventListener('click', () => { const open = timebar.hidden; timebar.hidden = !open; $('#btn-time').setAttribute('aria-pressed', String(open)); if (open) { placeTimebar(); syncTimeButtons(); } });
timebar.querySelectorAll('[data-time]').forEach((b) => b.addEventListener('click', () => { timeKey = b.dataset.time; syncTimeButtons(); }));
$('#btn-pause').addEventListener('click', () => { paused = !paused; syncTimeButtons(); });
$('#btn-overview').addEventListener('click', goOverview);
$('#btn-list').addEventListener('click', () => { const on = $('#btn-list').getAttribute('aria-pressed') === 'true'; if (on) { hideSheet(); state.mode === 'overview' || setLabels(); return; } renderList(); $('#btn-list').setAttribute('aria-pressed', 'true'); $('#btn-progress').setAttribute('aria-pressed', 'false'); });
$('#btn-progress').addEventListener('click', () => { const on = $('#btn-progress').getAttribute('aria-pressed') === 'true'; if (on) { hideSheet(); return; } renderProgress(); $('#btn-progress').setAttribute('aria-pressed', 'true'); $('#btn-list').setAttribute('aria-pressed', 'false'); });
$('#btn-help').addEventListener('click', () => { $('#btn-help').setAttribute('aria-pressed', 'true'); showCoach(0); });
$('#sheet-close').addEventListener('click', () => { if (state.mode === 'pin') openIsland(state.island); else if (state.mode === 'island' && $('#btn-list').getAttribute('aria-pressed') !== 'true' && $('#btn-progress').getAttribute('aria-pressed') !== 'true') goOverview(); else hideSheet(); });
crumb.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (!b) return; if (b.dataset.go === 'overview') goOverview(); else openIsland(state.island); });

addEventListener('keydown', (e) => {
  if (e.target.closest('input,select,textarea')) return;
  if (!$('#coach').hidden) { if (e.key === 'Escape') closeCoach(); return; }
  if (e.key === 'Escape') { if (state.mode === 'pin') openIsland(state.island); else if (!sheet.hidden && state.mode !== 'island') hideSheet(); else if (state.mode !== 'overview') goOverview(); }
  if (/^[1-6]$/.test(e.key)) openIsland('w' + e.key);
  if (e.key === '0' || e.key.toLowerCase() === 'h') openIsland('hq');
  if (has3D && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { fly = null; const off3 = camera.position.clone().sub(controls.target); off3.applyAxisAngle(V(0, 1, 0), e.key === 'ArrowLeft' ? -0.12 : 0.12); camera.position.copy(controls.target).add(off3); }
});
addEventListener('hashchange', routeHash);
function routeHash() { const h = location.hash.slice(1); if (h === 'hq' || WEEKS[h]) { if (state.island !== h) openIsland(h, true); } }

/* picking */
let downAt = null;
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
function pickIsland(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(Object.values(islands).map((i) => i.g), true);
  for (const h of hits) { let o = h.object; while (o && !o.userData.id) o = o.parent; if (o) return o.userData.id; }
  return null;
}
function pickCritter(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(critters, true);
  for (const h of hits) { let o = h.object; while (o && !o.userData.critter) o = o.parent; if (o && o.visible !== false) return o.userData.critter; }
  return null;
}
function bindPicking() {
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  cv.addEventListener('pointerup', (e) => {
    if (!downAt) return; const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y); const quick = performance.now() - downAt.t < 450; downAt = null;
    if (moved > 6 || !quick) return;
    const kind = pickCritter(e.clientX, e.clientY);
    if (kind) { toast(`${{ whale: '🐋 鯨魚', dolphin: '🐬 海豚', gull: '🕊️ 海鷗' }[kind]}提醒你｜${TIPS[(Math.random() * TIPS.length) | 0]}`); return; }
    const id = pickIsland(e.clientX, e.clientY); if (id && (state.island !== id || state.mode !== 'island')) openIsland(id);
  });
  let hoverT = 0;
  cv.addEventListener('pointermove', (e) => { if (e.buttons || performance.now() - hoverT < 80) return; hoverT = performance.now(); cv.style.cursor = pickIsland(e.clientX, e.clientY) || pickCritter(e.clientX, e.clientY) ? 'pointer' : 'grab'; });
}

/* main loop */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  if (!paused) simT += dt;
  if (!paused) anims.forEach((f) => f(simT, dt));
  stepTime(dt);
  if (fly) { fly.t += dt; const k = ease(Math.min(1, fly.t / fly.dur)); controls.target.lerpVectors(fly.fT, fly.tT, k); camera.position.lerpVectors(fly.fP, fly.tP, k); if (k >= 1) fly = null; }
  controls.update();
  off.x += (off.tx - off.x) * Math.min(1, dt * 6); off.y += (off.ty - off.y) * Math.min(1, dt * 6);
  camera.setViewOffset(innerWidth, innerHeight, off.x, off.y, innerWidth, innerHeight);
  const camDist = camera.position.distanceTo(controls.target);
  scene.fog.near = camDist + 40; scene.fog.far = camDist + 320;
  const r = 0.5 + off.y / innerHeight; hPass.uniforms.r.value = r; vPass.uniforms.r.value = r;
  composer.render();
  placeOverlay();
  requestAnimationFrame(frame);
}

/* boot */
function boot() {
  try { init3D(); } catch (err) {
    console.error(err); has3D = false;
    const fb = document.createElement('div'); fb.className = 'fallback'; fb.innerHTML = '<div><h2>這台裝置無法顯示 3D 城市</h2><p>仍然可以用右側的「清單」瀏覽六週課程的所有內容。</p></div>'; $('#stage').appendChild(fb); overlay.hidden = true;
  }
  buildOverlay(); syncTimeButtons();
  addEventListener('resize', () => { if (has3D) { targetOffset(); resize(); } if (!timebar.hidden) placeTimebar(); });
  new ResizeObserver(() => targetOffset()).observe(sheet);
  if (has3D) { bindPicking(); requestAnimationFrame(frame); setTimeout(() => { $('#hint').hidden = true; }, 9000); } else { $('#hint').hidden = true; renderList(); }
  const h = location.hash.slice(1);
  if (h === 'hq' || WEEKS[h]) openIsland(h, true);
  else if (!store.get('codeIsles.coach', 0)) showCoach(0);
}
const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(boot);
</script>
